        document.getElementById("summary").textContent=data.summary;

        const skillsElement = document.getElementById("skills-grid");
        data.skills.forEach(skill=>{
            div=document.createElement("div");
            div.className="skill-category";
            div.innerHTML=`<h4>${skill.category}</h4><p>${skill.technologies}</p>`;

        });

        const workExperiencesElement = document.getElementById("work-experience");
        data.work.forEach(job=>{
            const workExperienceDiv = document.createElement("div");
            workExperienceDiv.className='experience';
            workExperienceDiv.innerHTML=`
                    <h3>${job.title} - ${job.company}</h3>
                    <p class="text-muted">${job.period} | ${job.location}</p>
                    <ul>${job.achievements.map(a => `<li>${a}</li>`).join('')}</ul>
                `;
            workExperiencesElement.appendChild(workExperienceDiv);
        });

        const educationBackgroundElement = document.getElementById("education-background");
        data.education.forEach(edu=>{
            const educationBackgroundDiv = document.createElement("div");
            educationBackgroundDiv.className='education';
            educationBackgroundDiv.innerHTML=`
                    <h3>${edu.degree} - ${edu.institution}</h3>
                    <p class="text-muted">${edu.period} | ${edu.location}</p>
                    <p>${edu.details}</p>
                `;
            educationBackgroundElement.appendChild(educationBackgroundDiv);
        });

        const map = L.map('map').setView([40, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        data.locations.forEach(loc => {
            L.marker(loc.coordinates).addTo(map).bindPopup(loc.name);
        });
